name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev OIDC authentication
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1 # configures the OIDC token for pub
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
      - run: flutter pub get
      - run: git status --short
      - run: flutter pub publish --force
